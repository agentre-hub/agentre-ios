# 与 README「Full test suite」是同一条命令，拆成两半跑，固定了 Xcode、模拟器系统与 XcodeGen 版本：
# - unit：除界面测试外的全部测试，每个 PR 与 main 都跑（约 6 分钟）；
# - ui：AgentreUITests（真实 App 对伪服务端，中英 × 浅深），只在 main 与手动触发时跑（约 23 分钟）。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      # Vendor/agentre 用的是 SSH 地址；没给 ssh-key 时 checkout 会改走 HTTPS，它是公开仓库，无需额外凭据。
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: >-
          xcodebuild test -project Agentre.xcodeproj -scheme Agentre
          -derivedDataPath "$RUNNER_TEMP/agentre-dd"
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0'
          -skip-testing:AgentreUITests
          -resultBundlePath "$RUNNER_TEMP/agentre-unit.xcresult"
          -collect-test-diagnostics never
          DIAGNOSE_MISSING_TARGET_DEPENDENCIES=YES_ERROR
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agentre-unit-xcresult
          path: ${{ runner.temp }}/agentre-unit.xcresult
          retention-days: 7

  ui:
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - name: UI tests
        run: >-
          xcodebuild test -project Agentre.xcodeproj -scheme Agentre
          -derivedDataPath "$RUNNER_TEMP/agentre-dd"
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0'
          -only-testing:AgentreUITests
          -resultBundlePath "$RUNNER_TEMP/agentre-ui.xcresult"
          -collect-test-diagnostics never
          DIAGNOSE_MISSING_TARGET_DEPENDENCIES=YES_ERROR
      # 失败时留下结果包：主线每一步的截图与失败时的无障碍树都在里面。
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agentre-ui-xcresult
          path: ${{ runner.temp }}/agentre-ui.xcresult
          retention-days: 7
