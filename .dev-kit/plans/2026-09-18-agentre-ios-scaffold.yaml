goal: "真机上完成一整条闭环：设备流登录 → 连上中继 → 在机器详情页把一条会话保存到手机 → 消息列表（读本地库）看到它等你处理 → 打开它读完转录 → 就地批准一次工具权限并发一句话；断网后重开应用，已保存会话的历史照常可读。且规格中十四屏全部实现，两套主题与 44×44pt 命中区各有守卫。"

