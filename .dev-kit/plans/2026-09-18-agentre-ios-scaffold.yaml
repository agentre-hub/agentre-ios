spec: docs/specs/2026-09-18-agentre-ios-scaffold.md
status: ready
mode: subagent
worktree: "none: 用户选择在当前 checkout 上开专用分支 2026-09-18-agentre-ios-scaffold"

goal: "真机上完成一整条闭环：设备流登录 → 连上中继 → 在机器详情页把一条会话保存到手机 → 消息列表（读本地库）看到它等你处理 → 打开它读完转录 → 就地批准一次工具权限并发一句话；断网后重开应用，已保存会话的历史照常可读。且规格中十四屏全部实现，两套主题与 44×44pt 命中区各有守卫。"

context:
  - "buf 没有 Makefile 入口，唯一入口是 pnpm 脚本：proto:generate = `cd ../../../pkg/wire && buf generate`，proto:check 额外跑 lint/breaking 并 `git diff --exit-code -- . ../../frontend/packages/agentre-wire/src/gen`——新增 Swift 产物目录落在 pkg/wire 下即自动被那个 `.` 覆盖（agentre/frontend/packages/agentre-wire/package.json:20-21）"
  - "buf 是 devDependency @bufbuild/buf 1.72.0，不在 PATH 上（agentre/frontend/packages/agentre-wire/package.json:29）"
  - "buf.gen.yaml 带 clean: true，任何新 out: 目录只能放生成物，手写 Swift 必须在它之外（agentre/pkg/wire/buf.gen.yaml:2；既有先例 protocolversion/ eventkind/ guard/ 都在 agentrewire/ 之外）"
  - "跨语言金样本 23 份 JSON 在 agentre/frontend/packages/agentre-wire/fixtures/，由 `WIRE_GOLDEN_WRITE=1 go test ./internal/pkg/agentruntime/runtimes/remote/wire/ -run TestWriteGoldenSamples` 产出、TestGoldenFixturesFresh 冻结；TS 侧消费方是 src/__tests__/wire-codec.test.ts:54-72（ls 计数 = 23）"
  - "「全工作区只有一份 wire.pb.go」的守卫是 agentre-server/internal/pkg/relaywire/single_source_test.go:38-70 与 agentre/pkg/wire/guard/schema_home_test.go:23-52；两者都只认 *.pb.go，没有任何守卫约束第二份生成的 Swift"
  - "agentre/Makefile:188 以 `go test -C pkg/wire ./...` 单独一行跑该 module；嵌在其下的 Swift 包不会被现有目标覆盖"
  - "/v1/relay/client 直接接受原生端设备 access token，浏览器票据只是并行的第二条路（agentre-server/internal/api/router.go:381-385）；该端点还承载一条保留信号通道 relay_svc.SignalChannelID，推 sync_version / mirror_changed / device_presence（同处注释）——规格未提及，列表新鲜度可据此实现而不必轮询"
  - "通道目标由该通道的第一帧给出，形式为 conversation:<id> / machine:<fingerprint>（agentre-server/frontend/src/lib/relayConnection.ts:275-282、frontend/src/lib/relayTarget.ts:20-32）；信封 = 2 字节大端通道 ID 长度 + UTF-8 id + payload，MaxChannelIDBytes 128（agentre/pkg/wire/relayenvelope/relayenvelope.go:21-31）"
  - "RPC 方法表 65 条、各带固定数字 id（`grep -c 'method(' agentre/frontend/packages/agentre-wire/src/rpc-methods.ts` → 65）；协议版本取自 proto 文件选项而非字面量（agentre/pkg/wire/protocolversion/protocolversion.go:33-40）"
  - "待移植的纯函数原件：agentre-ui/src/transcript/activity-block/facts.ts(197)、canonical-tool/tier.ts(98)+tier.test.ts(198)、composer/context-usage.ts(49)、agentre-server/frontend/src/components/session/newconv/projectMembers.ts（用例 src/__tests__/project-members.test.ts）"
  - "REST 面形状（均在 agentre-server/internal/api/）：agentsession/session.go:28-108 列表（Groups/Items 互斥，每项同时带 peer_fingerprint 与 device_fingerprint）、:118 已读、:142-190 转录（direction=forward|backward）、:194-215 待处理计数（无任何参数）；device/device.go:5-15 设备授权（device_kind 已收 mobile）、:25-37 取令牌、:84-93 刷新、:95-101 设备列表与撤销；workspace/workspace.go:15-47 agents、:52-100 dispatch-target（availability ∈ available|offline|unpaired|no_device|project_path_missing）、:154-190 项目树、:106-128 设备详情"
  - "工具链：macOS 27.0 / Xcode 27.0 / Swift 6.4，仅 iOS 27 SDK，brew 与 protoc 在（`sw_vers`、`xcodebuild -version`、`swift --version`、`xcodebuild -showsdks`）；xcodegen、buf、protoc-gen-swift、swiftlint、swiftformat 均未安装（`command -v`）——任务 1 与任务 2 开工前须先征得用户同意再安装"
  - "服务端的会话镜像只覆盖账号「保存过」的对话（agentre-server/internal/model/entity/agent_session_entity/save.go:11，守卫 internal/api/savedsession/guard_test.go:33），那是控制台自己的一份记录；本轮手机自有一套本地库，因此 /v1/agent-sessions/* 与 /v1/saved-sessions 一次都不调（规格决策 8/14）"
  - "中继侧会话取材的形状：SessionListRequest{keyword,limit,cursor,conversation_ids}→{sessions,cursor,has_more,total}（新到旧）、SessionCountsResponse{total,running,waiting}、SessionAttachResponse{latest_seq}、SessionPullResponse{notifications,cursor,has_more,oldest_seq}，SessionSummary 带 waiting_for_input/latest_seq/last_message_at/lifecycle_state，DurableNotification 带 seq 与源端 createtime（agentre/pkg/wire/proto/agentre/wire/wire.proto:500,537,548,615,627,641）"
  - "账号可见性：daemon 在调用方账号等于自己登录账号时列出全部会话，不限发起端（agentre/internal/daemon/handlers/session_catchup.go:58-59,367-380）；waiting_for_input 由 backend 现算、从不落库（同文件:382-387）——机器详情页因此能列出桌面端上开的会话供保存"
  - "服务端 mirror_svc 就是「认领机器 → attach → pull → 落自己的库」这一形状的既有先例，手机侧的本地库与它同构（agentre-server/internal/service/mirror_svc/）"
  - "编排决定（不在规格内，为并发而设）：每个功能自成一个 SwiftPM target，自带目录、自带 <Feature>.xcstrings 与自带测试目标；Package.swift 与 project.yml 由任务 2 一次性声明全部 target 后即冻结，其余任务只在自己的目录内写。没有这条，Localizable.xcstrings 与清单会成为所有界面任务的共享写入，并发就不存在"

